[package]
name = "hauler-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"

[[bin]]
name = "hauler"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hauler-engine = { version = "0.2.2", path = "../hauler-engine" }
hauler-ipc = { version = "0.2.2", path = "../hauler-ipc" }
indicatif = "0.18.6"
libc = "0.2.191"
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
hauler-daemon = { path = "../hauler-daemon" }
hauler-testserver = { path = "../hauler-testserver" }
toml = "0.9"
tokio-util = "0.7.20"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
