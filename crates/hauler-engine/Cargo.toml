[package]
name = "hauler-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
fastrand = "2.5.0"
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls", "system-proxy"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
hauler-testserver = { path = "../hauler-testserver" }
hex = "0.4.3"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
