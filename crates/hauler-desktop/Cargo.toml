[package]
name = "hauler-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"

[[bin]]
name = "hauler-desktop"
path = "src/main.rs"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
hauler-ipc = { version = "0.1.0", path = "../hauler-ipc" }
libc = "0.2.191"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[build-dependencies]
cxx-qt-build = "0.10.0"
