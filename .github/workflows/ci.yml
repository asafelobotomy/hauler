name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check
      - name: File length
        run: scripts/check-loc.sh

  test:
    name: Clippy and tests (Arch, Qt 6, Kirigami)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust cmake dbus \
            qt6-base qt6-declarative kirigami kitemmodels qqc2-desktop-style
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: uQ's kits (uq/native.toml) are the pinned releases, and the problem codes match uq/diag/hauler.toml
        run: scripts/check-uq-native.sh
      - name: Tests
        run: cargo test --workspace --locked

  deny:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          command: check advisories

  # hauler's Downloads page in uQ Settings (uq/pages/hauler/): its Node and QML tests, and uqctl's own check of
  # the uq/ folder. The command-line contract the page relies on is tested in the Arch job above
  # (cargo test -p hauler-cli --test uq_page).
  uq:
    name: uQ Settings page
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The uQ release whose `uqctl` checks the page (uq_api 3 is in every release since v0.3.0).
      UQ_TAG: v0.3.37
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt Quick and qmltestrunner
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-layouts qml6-module-qtquick-controls \
            qml6-module-qttest qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtquick-dialogs
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Page logic and manifest tests (Node)
        run: node --test 'tests/uq/*.test.mjs'
      # QML_XHR_ALLOW_FILE_READ lets the page tests read tests/uq/fixtures/.
      - name: Page tests (QML, offscreen)
        run: QML_XHR_ALLOW_FILE_READ=1 QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq
      - name: Cache uqctl
        id: uqctl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uq
          key: uqctl-${{ env.UQ_TAG }}
      - name: Build uqctl
        if: steps.uqctl.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/asafelobotomy/uq --tag "$UQ_TAG" uqctl --root "$HOME/.uq"
      # `--no-programs` skips only the "program exists" check: hauler isn't installed here.
      - name: uQ integration check
        run: ~/.uq/bin/uqctl integrations check --no-programs uq/
