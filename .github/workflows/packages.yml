name: Packages

# Builds every package on version tags (and publishes a GitHub release), on
# pull requests that touch packaging, and on demand.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/packages.yml'
      - 'dist/**'
      - 'scripts/build-*.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          crate=$(cargo pkgid -p hauler-cli | sed 's/.*[#@]//')
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            tag=${GITHUB_REF#refs/tags/v}
            [[ $tag == "$crate" ]] || { echo "::error::tag v$tag does not match crate version $crate"; exit 1; }
            echo "version=$crate" >> "$GITHUB_OUTPUT"
          else
            echo "version=$crate-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  appimage:
    name: AppImage (Debian 13 base, glibc 2.41+)
    needs: version
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake curl ca-certificates git file patchelf pkg-config \
            qmake6 qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-wayland qt6-qpa-plugins libqt6svg6 qt6-svg-plugins qt6-xdgdesktopportal-platformtheme \
            breeze-icon-theme \
            qml6-module-org-kde-kirigami qml6-module-org-kde-kitemmodels qml6-module-org-kde-desktop \
            qml6-module-qt-labs-platform qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick-window
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Fetch linuxdeploy
        run: |
          mkdir -p target/appimage-tools
          cd target/appimage-tools
          for repo in linuxdeploy linuxdeploy-plugin-qt; do
            curl -fsSLO "https://github.com/linuxdeploy/$repo/releases/download/continuous/$repo-x86_64.AppImage"
          done
          chmod +x *.AppImage
      - name: Build AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/build-appimage.sh
      - name: Smoke test (headless)
        run: |
          app=$(ls target/appimage/Hauler-*-x86_64.AppImage)
          # No FUSE, no display and no GPU in the container.
          export APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software
          export XDG_STATE_HOME=$RUNNER_TEMP/state XDG_RUNTIME_DIR=$RUNNER_TEMP/run HAULER_DESKTOP_DEMO=$RUNNER_TEMP/shot
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          timeout 120 "$app"
          ls "$RUNNER_TEMP"/shot-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: target/appimage/Hauler-*-x86_64.AppImage
          if-no-files-found: error

  arch:
    name: Arch package
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust cmake \
            qt6-base qt6-declarative kirigami kitemmodels qqc2-desktop-style hicolor-icon-theme
          useradd -m builder
      - uses: actions/checkout@v4
      - name: Build package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chown -R builder .
          # pkgver may not contain '-'.
          sed -i "s/^pkgver=.*/pkgver=${VERSION//-/.}/" dist/arch/PKGBUILD
          cd dist/arch
          sudo -u builder makepkg --noconfirm --nodeps
      - name: Check package contents
        run: pacman -Qlp dist/arch/hauler-*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/arch/hauler-*.pkg.tar.zst
          if-no-files-found: error

  static:
    name: Static CLI and daemon (musl)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools cmake
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/build-static.sh
      - name: Smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dir=target/static/hauler-$VERSION-x86_64-linux-musl
          file "$dir/hauler" "$dir/haulerd"
          "$dir/hauler" --version
          "$dir/haulerd" --version
      - uses: actions/upload-artifact@v4
        with:
          name: static
          path: target/static/hauler-*-x86_64-linux-musl.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, appimage, arch, static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "Hauler ${{ needs.version.outputs.version }}" --generate-notes
