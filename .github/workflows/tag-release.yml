name: Tag release

# When a push to main changes the version (Cargo.toml) and no tag for that version exists yet
# (the merge of a release PR), this creates the vX.Y.Z tag on that commit and starts packages.yml
# on it. The tag is made with GITHUB_TOKEN, and GitHub does not start workflows for pushes made
# with that token, so packages.yml is started explicitly (workflow_dispatch) on the tag. packages.yml
# still checks the tag against the version before it publishes anything. Pushing a tag by hand
# still works the same way. Anything that needs your own keys (the AUR) stays manual.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag
      actions: write # start packages.yml
    steps:
      - name: Tag the new version and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          raw=$(gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/Cargo.toml?ref=$SHA")
          version=$(printf '%s\n' "$raw" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Cannot read a release version from Cargo.toml (got '$version')."
            exit 1
          fi
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to tag."
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null
          echo "Tagged $SHA as $tag."
          gh workflow run packages.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "Started packages.yml on $tag." | tee -a "$GITHUB_STEP_SUMMARY"
